name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore BluetoothBatteryIndicator/BluetoothBatteryIndicator.csproj

      # Targets .NET Framework 4.8, which is part of Windows 10/11: nothing to bundle
      - name: Publish
        run: |
          dotnet publish BluetoothBatteryIndicator/BluetoothBatteryIndicator.csproj `
            -c Release `
            -o publish

      - name: Upload publish artifacts
        uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish/

  installer:
    runs-on: windows-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifacts
        uses: actions/download-artifact@v4
        with:
          name: publish
          path: publish/

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $env:APP_VERSION = $version
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/BluetoothBatteryIndicator.iss
        shell: pwsh

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/BluetoothBatteryIndicator_Setup.exe

  # Future: Add msix job here
  # msix:
  #   runs-on: windows-latest
  #   needs: build
  #   steps:
  #     - name: Build MSIX package
  #       run: ...
  #     - name: Upload to Microsoft Store
  #       uses: microsoft/store-submission@v1
  #       with:
  #         ...

  release:
    runs-on: ubuntu-latest
    needs: [installer]

    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: installer
          path: installer/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/BluetoothBatteryIndicator_Setup.exe
